name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # Plain assert-based scripts (no pytest) - each is self-contained and manages its own
      # temp-file SQLite DB, so they just need to be run directly with the interpreter.
      - name: Run backend tests
        run: |
          for f in tests/test_*.py; do
            echo "=== $f ==="
            python3 "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # node's bundled npm is older than the one the lockfile was generated with - see Dockerfile.
      - run: npm install -g npm@11 && npm ci

      - name: Production build
        run: npm run build -- --configuration production
