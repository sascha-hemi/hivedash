name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # Plain assert-based scripts (no pytest) - each is self-contained and manages its own
      # temp-file SQLite DB, so they just need to be run directly with the interpreter.
      - name: Run backend tests
        run: |
          for f in tests/test_*.py; do
            echo "=== $f ==="
            python3 "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # node's bundled npm is older than the one the lockfile was generated with - see Dockerfile.
      - run: npm install -g npm@11 && npm ci

      - name: Production build
        run: npm run build -- --configuration production

  # Builds and publishes the same multi-stage image docker-compose builds locally, so a user
  # can just `docker compose pull` instead of needing the repo checked out at all. Only runs on
  # a push to main or a version tag (never on a pull_request) - a PR from a fork has no
  # packages:write permission on GITHUB_TOKEN, and publishing an image from unreviewed PR code
  # would be a supply-chain risk anyway. Gated on both test jobs passing first, so a broken
  # build never gets tagged "latest".
  docker:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Baked into the image as HIVEDASH_VERSION (see Dockerfile) - "X.Y.Z" for a version
          # tag push, "main" for a push to main - surfaced by GET /api/version for the
          # frontend's version display + update-check.
          build-args: HIVEDASH_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
