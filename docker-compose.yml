services:
  hivedash:
    image: ghcr.io/sascha-hemi/hivedash:latest
    # Building locally instead (e.g. to test an uncommitted change) - comment out the
    # image: line above and uncomment this one:
    # build: .
    container_name: hivedash
    restart: unless-stopped
    ports:
      - "8081:8000"
    env_file:
      - .env
    volumes:
      - dashboard-data:/srv/data

volumes:
  dashboard-data:
